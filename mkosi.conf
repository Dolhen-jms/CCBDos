[Config]
# Version de mkosi pour build l'image -- fail si version antérieur
MinimumVersion=27

[Distribution]
# Les infos sur la distribution qu'on est en train de build
Distribution=debian
Release=forky
Architecture=x86-64
Repositories=non-free-firmware

[Output]
# Les infos pour la création de l'image
ImageId=CCBDos
Output=%i_%v_%a
Format=disk
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache
# mkosi construit l'outil de build -- le build devient indépendant de la machine -- normalement
ToolsTree=default
History=yes
Incremental=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=ttyS0
WithRecommends=no
Packages=
		linux-image-amd64
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-timesyncd
        udev
        dbus-broker
        login
        passwd
        util-linux
        iproute2
        less
        vim-tiny

[Runtime]
RAM=4G
CPUs=4
