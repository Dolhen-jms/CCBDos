[Config]
# Version de mkosi pour build l'image -- fail si version antérieur
MinimumVersion=27

[Distribution]
# Les infos sur la distribution qu'on est en train de build
Distribution=debian
Release=forky
Architecture=x86-64
Repositories=non-free-firmware

[Output]
# Les infos pour la création de l'image
ImageId=CCBDos
Output=%i_%v_%a
Format=disk
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache
# mkosi construit l'outil de build -- le build devient indépendant de la machine -- normalement
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=unstable
ToolsTreePackages=udev
History=yes
Incremental=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
# Console série (just connect) + écran (just view) ; la dernière console= reçoit /dev/console,
# donc l'assistant de premier démarrage s'affiche à l'écran
KernelCommandLine=console=ttyS0 console=tty0
WithRecommends=no
# Pas de Hostname=, Locale=, Keymap=, Timezone= : systemd-firstboot les demande au premier démarrage
# (ou les reçoit en credentials, voir "just virtualize")
# openssh-server génère ses clés d'hôte à l'installation : ne pas les livrer (toutes les machines
# auraient les mêmes), sshd-keygen.service les régénère au premier démarrage
RemoveFiles=/etc/ssh/ssh_host_*
# Réglages posés par les paquets (tzdata...) : les retirer pour que systemd-firstboot les demande
RemoveFiles=/etc/localtime /etc/timezone /etc/locale.conf
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-timesyncd
        udev
        dbus-broker
        login
        passwd
        util-linux
        iproute2
        less
        vim-tiny
        tzdata
        locales
        openssh-server

[Runtime]
RAM=4G
CPUs=4
